name: Research Platform Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
      - name: Install pinned environment
        run: |
          python -m pip install uv==0.13.3
          uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formatting
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Dependency consistency
        run: uv pip check
      - name: Application tests without model downloads or paid APIs
        run: uv run pytest -q
# Real Docling/BGE and future RAGAs evaluations run separately; no placeholder scores.
